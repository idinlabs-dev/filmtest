name: chinese_drama_streaming_app
description: A Flutter app for streaming Chinese dramas with dummy data
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.1
  chewie: ^1.7.2
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  http: ^1.2.0
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/